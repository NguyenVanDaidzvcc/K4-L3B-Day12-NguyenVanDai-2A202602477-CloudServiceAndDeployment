# CP2 — Stack chạy cục bộ: agent và Redis.
#
# Yêu cầu:
#   - Agent build từ Dockerfile.
#   - Publish cổng 8000 ra máy host.
#   - API key đọc từ .env hoặc biến môi trường.
#   - REDIS_URL dùng hostname redis trong mạng Compose.
#   - Agent chờ Redis healthy trước khi khởi động.
#   - Có healthcheck cho cả hai service.
#
# Chạy:
#   docker compose up -d --build
#
# Kiểm tra:
#   docker compose ps
#   pytest tests/test_cp2.py -v
#
# Bản này publish cổng cố định cho một agent.
# Nếu muốn scale nhiều agent, cần chuyển cổng public sang
# reverse proxy và bỏ mapping 8000:8000 trên từng agent.

services:
  redis:
    image: redis:7-alpine

    # Bật AOF để Redis lưu thay đổi xuống đĩa.
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis-data:/data

    # Không publish Redis ra host.
    # Agent truy cập Redis qua mạng nội bộ Compose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .

    ports:
      - "8000:8000"

    environment:
      PORT: "8000"

      # Bắt buộc cung cấp API key, không hardcode secret.
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in .env}

      # redis là tên service, không dùng localhost.
      REDIS_URL: redis://redis:6379/0

      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    depends_on:
      redis:
        condition: service_healthy

    # Cho ứng dụng thời gian shutdown trước khi bị buộc dừng.
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data: