name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        # CP5 needs a live deployment; the badge needs an already completed run.
        run: python -m pytest tests/ -v --ignore=tests/test_cp5.py -k "not test_badge_bao_passing" -m "not docker"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Missing secret RAILWAY_TOKEN'; exit 1; }
          test -n "$RAILWAY_SERVICE" || { echo 'Missing variable RAILWAY_SERVICE'; exit 1; }
          test -n "$PUBLIC_URL" || { echo 'Missing variable PUBLIC_URL'; exit 1; }
          railway up --service "$RAILWAY_SERVICE" --ci
      - name: Check deployed health and readiness
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 "${PUBLIC_URL%/}/health"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 "${PUBLIC_URL%/}/ready"
